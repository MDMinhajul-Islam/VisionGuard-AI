[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard-backend"
version = "0.1.0"
description = "Offline research backend for VisionGuard AI"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "mediapipe>=0.10.30,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=25,<26",
  "psutil>=7,<8",
  "ftfy>=6.3,<7",
  "regex>=2024.11",
  "tqdm>=4.67",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: downloads or executes real pretrained models",
]

