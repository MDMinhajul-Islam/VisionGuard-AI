name: Security CI

on:
  pull_request:
  push:
    branches: [feat/enterprise-security-isolation]

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e "backend[test]"
      - name: Dependency consistency
        run: pip check
      - name: Authorization, migration, and backend tests
        env:
          VISIONGUARD_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
        run: pytest backend/tests -m "not integration" --strict-markers
      - name: Credential pattern scan
        run: python scripts/check_secrets.py

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
